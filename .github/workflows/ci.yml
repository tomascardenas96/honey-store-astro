name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    # PUBLIC_WHATSAPP_PHONE está declarada en el schema de astro:env, así que
    # el build la exige. Acá va un valor de relleno: es una variable pública y
    # el artefacto del CI no se despliega. Los secretos del formulario no hacen
    # falta, se resuelven en runtime y no en build.
    env:
      PUBLIC_WHATSAPP_PHONE: "5493815551234"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
